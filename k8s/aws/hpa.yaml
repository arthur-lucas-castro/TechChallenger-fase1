# HPA para o Deployment da API no EKS. Requer metrics-server instalado no
# cluster (não vem por padrão no EKS) — ver instruções de instalação abaixo.
#
# NOTA: o Deployment neste repositório se chama "techchallenger-api"
# (k8s/aws/deployment.yaml), não "workshop-api" — scaleTargetRef.name abaixo
# aponta para o nome real. Se o seu Deployment no cluster tiver outro nome,
# ajuste aqui para bater exatamente com metadata.name do Deployment.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: techchallenger-api
  labels:
    app: techchallenger-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: techchallenger-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
