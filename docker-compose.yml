services:
  postgres:
    build:
      context: ./database
    container_name: techchallenger-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: techchallenger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
    container_name: techchallenger-api
    ports:
      - "5158:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=techchallenger;Username=postgres;Password=postgres"
      Jwt__SecretKey: "TechChallengerSecretKey@2024!MustBe32CharsMin"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
