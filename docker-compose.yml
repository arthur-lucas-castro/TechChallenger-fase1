services:
  postgres:
    build:
      context: ./database
    container_name: techchallenger-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: techchallenger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
    container_name: techchallenger-api
    ports:
      - "5158:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=techchallenger;Username=postgres;Password=postgres"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
